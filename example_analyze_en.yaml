# Example configuration for EN wind analysis
# This file specifies masts for civil engineering load calculations

masts:
  - name: "Mast1"
    x: 12345.67      # X coordinate
    y: 98765.43      # Y coordinate  
    H: 80            # Hub height or measurement channel height (meters)
    GeoHash: "wmnrtewnzz"  # Optional, defaults to "wmnrtewnzz"
    input:
      data_path: "./mast1_data.csv"         # Path to CSV data file
      sensor_path: "./mast1_sensors.yaml"   # Path to sensor configuration
      
  - name: "Mast2"
    x: 12400.00
    y: 98800.00
    H: 100           # Different height for this mast
    # GeoHash will use default value
    input:
      data_path: "./mast2_data.csv"
      sensor_path: "./mast2_sensors.yaml"

# Notes:
# - data_path: Should point to a CSV file with time series data
# - sensor_path: Should point to a YAML file defining sensors (same format as CleanMast sensor configs)
# - H: The height at which to analyze wind speed and direction
# - Paths can be absolute or relative to this YAML file 