# Example configuration for analyze reconstruct-single command
# This analyzes the differences between time series data before and after reconstruction

masts:
  - name: Mast01
    before_reconstruction:
      csv: projects/example_project/timeseries/tower-shading/Mast01.csv
      sensorConfig: projects/example_project/sensors/Mast01.yaml
    after_reconstruction:
      csv: projects/example_project/timeseries/reconstruct-single/Mast01.csv
      sensorConfig: projects/example_project/sensors/Mast01.yaml

# Optional output configuration
output:
  # Output directory (default: ./analyze-reconstruct-single)
  dir: ./analyze-reconstruct-single 