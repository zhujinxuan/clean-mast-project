# ── Tool versions ────────────────────────────────────────────
[tools]
julia = "1.12"
uv = "latest"
pandoc = "latest"

# ── Tasks ────────────────────────────────────────────────────
[tasks.bootstrap]
description = "Install all dependencies (Python + Julia)"
run = "uv sync --all-groups --all-packages --all-extras && julia --project=CleanMastProject -e \"using Pkg; Pkg.instantiate(); Pkg.status()\""
