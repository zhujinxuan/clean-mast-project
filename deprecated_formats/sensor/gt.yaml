sensor:
  column_formats:
    - "{sensorType}_{height}Am_{statType} {unit}"
    - "{sensorType}_{height}Bm_{statType} {unit}"
    - "{sensorType}_{height}m_{statType} {unit}"
    - "{sensorType}_{height}Am_{statType}"
    - "{sensorType}_{height}Bm_{statType}"
    - "{sensorType}_{height}m_{statType}"
  timestamp_column: "Date/Time"
  # timestamp_format: "yyyy-mm-dd HH:MM:SS"
  # delim: "\t"
  mappings:
    - match:
        sensorType: WS
      rule:
        sensorType: WindSpeed
        unit: m/s
    - match:
        sensorType: WD
      rule:
        sensorType: WindDirection
        unit: deg
    - match:
        statType: Avg
      rule:
        statType: avg
    - match:
        statType: Max
      rule:
        statType: max
    - match:
        statType: Min
      rule:
        statType: min
    - match:
        statType: Std
      rule:
        statType: sd
    - match:
        sensorType: AirTC
      rule:
        sensorType: Temperature
        unit: C
    - match:
        sensorType: BP
      rule:
        sensorType: Pressure
        unit: Pa
        multiplier: 100.0