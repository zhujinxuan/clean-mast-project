# Mesoscale Reconstruction Configuration
# Uses trained models to fill remaining gaps with mesoscale data

[[mesos]]
name = "ERA5M1664"

    [mesos.input]
    data = "./raw/ERA5M1664.parquet"
[[mesos]]
name = "ERA5M3142"

    [mesos.input]
    data = "./raw/ERA5M3142.parquet"
[[mesos]]
name = "ERA5M5057"

    [mesos.input]
    data = "./raw/ERA5M5057.parquet"
[[mesos]]
name = "ERA5M5972"

    [mesos.input]
    data = "./raw/ERA5M5972.parquet"

[[masts]]
name = "M5057"

    [masts.output]
    data = "./reconstruct-meso\\M5057.parquet"

    [masts.models.windspeed]
    method = "1-sector"
    model_file = "./meso-models/M5057/ERA5M5057/windspeed/1-sector.jld2"
    meso_name = "ERA5M5057"

    [masts.models.winddirection]
    method = "constant-offset"
    model_file = "./meso-models/M5057/ERA5M5057/winddirection/constant-offset.jld2"
    meso_name = "ERA5M5057"

    [masts.input]
    data = "./reconstruct-cross/M5057_reconstructed.parquet"

    [masts.time_range]
    max = 2025-08-31T23:59:59.000Z
    min = 2022-09-01T00:00:00.000Z
