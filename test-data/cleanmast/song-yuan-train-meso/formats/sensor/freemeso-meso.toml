# FreeMESO sensor format configuration
timestamp_column = "Date/time"
# timestamp_format = "yyyy-mm-dd HH:MM:SS"
# delim = "\t"

# Column parsing patterns
[[columns]]
match = "{sensorType}_{height}m \\[{unit}\\]"
format = "{sensorType}_{height}m_{statType} [{unit}]"

# Mapping rules
[[mappings]]
[mappings.match]
sensorType = "Speed"
[mappings.rule]
sensorType = "WindSpeed"
unit = "m/s"
statType = "avg"
sensorDirection = ""

[[mappings]]
[mappings.match]
sensorType = "Direction"
[mappings.rule]
sensorType = "WindDirection"
unit = "deg"
statType = "avg" 
sensorDirection = ""