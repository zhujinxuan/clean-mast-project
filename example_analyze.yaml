masts:
  - name: "Mast1"
    csv: "data/mast1_cleaned.csv"  # Relative to this YAML file or absolute path
    sensorConfig: "sensors/mast1_sensors.yaml"  # Relative to this YAML file or absolute path
    airDensity: null
  
  - name: "Mast2"
    csv: "/absolute/path/to/mast2_data.csv"  # Absolute paths also supported
    sensorConfig: "sensors/mast2_sensors.yaml"
    airDensity:
      density: 1.20   # Different air density for different location
      reference_height: 100.0 # Reference height

output:
  path: "analysis_output"  # Relative to this YAML file
  docx:
    sectionIndex: "3.2"    # Section number in the report
    sectionLevel: 2        # Heading level (default: 2) 