# Gangbei 231013 sensor format configuration
timestamp_column = "DateTime"
timestamp_format = "yyyy/mm/dd HH:MM"
delim = ","
skip_to = 1

# Column parsing patterns with regex support
[[columns]]
match = "F{channel}_{sensorType}_{height}_{sensorDirection}_{brand}-40/40-{statType}"
format = "{sensorType}_{height}m_{sensorDirection}_{statType} [{unit}]"
[columns.patterns]
sensorDirection = "[0-9]+"  # Matches numeric directions like 90, 270

[[columns]]
match = "F{channel}_{sensorType}_{height}_{sensorDirection}_{brand}-40/40"
format = "{sensorType}_{height}m_{sensorDirection}_{statType} [{unit}]"
[columns.patterns]
sensorDirection = "[0-9]+"

[[columns]]
match = "F{channel}_{sensorType}_{height}_{sensorDirection}_{brand}"
format = "{sensorType}_{height}m_{sensorDirection}_{statType} [{unit}]"
[columns.patterns]
sensorDirection = "[0-9]+"

[[columns]]
match = "A{channel}_{sensorType}_{height}_{sensorDirection}_{brand}-{statType}"
format = "{sensorType}_{height}m_{sensorDirection}_{statType} [{unit}]"
[columns.patterns]
sensorDirection = "[0-9]+"

[[columns]]
match = "A{channel}_{sensorType}_{height}_{sensorDirection}_{brand}"
format = "{sensorType}_{height}m_{sensorDirection}_{statType} [{unit}]"
[columns.patterns]
sensorDirection = "[0-9]+"

# Mapping rules
[[mappings]]
[mappings.match]
sensorType = "WS"
[mappings.rule]
sensorType = "WindSpeed"
unit = "m/s"

[[mappings]]
[mappings.match]
statType = null
[mappings.rule]
statType = "avg"

[[mappings]]
[mappings.match]
sensorType = "WD"
[mappings.rule]
sensorType = "WindDirection"
unit = "deg"

[[mappings]]
[mappings.match]
statType = "Max"
[mappings.rule]
statType = "max"

[[mappings]]
[mappings.match]
statType = "Min"
[mappings.rule]
statType = "min"

[[mappings]]
[mappings.match]
statType = "STDev"
[mappings.rule]
statType = "sd"

[[mappings]]
[mappings.match]
sensorType = "TEM"
[mappings.rule]
sensorType = "Temperature"
unit = "C"

[[mappings]]
[mappings.match]
sensorType = "PR"
[mappings.rule]
sensorType = "Pressure"
unit = "Pa"
multiplier = 100.0 