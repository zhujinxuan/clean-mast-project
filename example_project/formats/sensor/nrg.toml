# NRG sensor format configuration
timestamp_column = "Timestamp"
# timestamp_format = "yyyy-mm-dd HH:MM:SS"
# delim = "\t"

# Column parsing patterns with separate match and format
[[columns]]
match = "Ch{channel}_{sensorType}_{height}m_{sensorDirection}_{statType}_{unit}"
format = "{sensorType}_{height}m_{sensorDirection}_{statType} [{unit}]"

[[columns]]
match = "Ch{channel}_{sensorType}_{height}m_{statType}_{unit}"
format = "{sensorType}_{height}m_{statType} [{unit}]"

# Mapping rules for transforming parsed values
[[mappings]]
[mappings.match]
sensorType = "Anem"
[mappings.rule]
sensorType = "WindSpeed"
unit = "m/s"

[[mappings]]
[mappings.match]
sensorType = "Vane"
[mappings.rule]
sensorType = "WindDirection"
unit = "deg"

[[mappings]]
[mappings.match]
statType = "Avg"
[mappings.rule]
statType = "avg"

[[mappings]]
[mappings.match]
statType = "Max"
[mappings.rule]
statType = "max"

[[mappings]]
[mappings.match]
statType = "Min"
[mappings.rule]
statType = "min"

[[mappings]]
[mappings.match]
statType = "SD"
[mappings.rule]
statType = "sd"

[[mappings]]
[mappings.match]
sensorType = "Analog"
unit = "C"
[mappings.rule]
sensorType = "Temperature"

[[mappings]]
[mappings.match]
sensorType = "Analog"
unit = "hPa"
[mappings.rule]
sensorType = "Pressure"
unit = "Pa"
multiplier = 100.0 