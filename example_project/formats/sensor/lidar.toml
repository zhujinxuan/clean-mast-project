# Lidar sensor format configuration for WindCube data
timestamp_column = "Timestamp"
# timestamp_format = "yyyy-mm-dd HH:MM:SS"
# delim = "\t"

# Column parsing patterns for lidar measurements
[[columns]]
match = "Lidar_{height}m_{sensorType}_{statType}_{unit}"
format = "{sensorType}_{height}m_{statType} [{unit}]"

# Lidar measurements without statType (e.g., DataAvailability)
[[columns]]
match = "Lidar_{height}m_{sensorType}_{unit}"
format = "{sensorType}_{height}m [{unit}]"

# Mapping rules for transforming parsed values
[[mappings]]
[mappings.match]
statType = "Avg"
[mappings.rule]
statType = "avg"

[[mappings]]
[mappings.match]
statType = "SD"
[mappings.rule]
statType = "sd"

[[mappings]]
[mappings.match]
statType = "Min"
[mappings.rule]
statType = "min"

[[mappings]]
[mappings.match]
statType = "Max"
[mappings.rule]
statType = "max"

# Unit standardization
[[mappings]]
[mappings.match]
unit = "Deg"
[mappings.rule]
unit = "deg"

[[mappings]]
[mappings.match]
unit = "m/s"
[mappings.rule]
unit = "m/s"

[[mappings]]
[mappings.match]
unit = "dB"
[mappings.rule]
unit = "dB"

[[mappings]]
[mappings.match]
unit = "%"
[mappings.rule]
unit = "%"

[[mappings]]
[mappings.match]
unit = "C"
[mappings.rule]
unit = "C"

[[mappings]]
[mappings.match]
unit = "hPa"
[mappings.rule]
unit = "Pa"
multiplier = 100.0

[[mappings]]
[mappings.match]
unit = "V"
[mappings.rule]
unit = "V"

# Sensor type mappings
[[mappings]]
[mappings.match]
sensorType = "IntTemp"
[mappings.rule]
sensorType = "Temperature"

[[mappings]]
[mappings.match]
sensorType = "ExtTemp"
[mappings.rule]
sensorType = "Temperature"
