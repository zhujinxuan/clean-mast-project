Mast:
  data_path: nrg-data.txt  # Path to data file (relative to config.yaml)
  sensor: "nrg"
  rules:
    - name: "High Wind Speed Layer Difference"
      sensorType: "WindSpeed"
      height:
        min: 70.0
        max: null
      layer_difference:
        lower_layer_height: 20.0
        abs_diff:
          min: null
          max: 2.0
        lower_wind_speed:
          min: null
          max: null
    - name: "High Wind Speed Layer Difference; 50m"
      sensorType: "WindSpeed"
      height:
        min: null
        max: 50
      layer_difference:
        lower_layer_height: 20.0
        abs_diff:
          min: null
          max: 3.0
        lower_wind_speed:
          min: null
          max: null
    - name: "High Wind Speed Layer Difference"
      sensorType: "WindDirection"
      height:
        min: 70.0
        max: null
      layer_difference:
        lower_layer_height: 20.0
        abs_diff:
          min: null
          max: 22.5
        lower_wind_speed:
          min: 3
          max: 25
    - name: "Wind Speed Range"
      sensorType: "WindSpeed"
      height:
        min: null
        max: null
      out_of_range:
        min: 0.0
        max: 30.0
    - name: "Wind Direction Range"
      sensorType: "WindDirection"
      height:
        min: null
        max: null
      out_of_range:
        min: 0.0
        max: 360.0
    - name: "Icing WS Detection"
      sensorType: "WindSpeed"
      height:
        min: null
        max: null
      icing:
        time_range: 7200
        max_change: 0.02
Meso:
  data_path: era5.txt
  sensor:
    format:
      column_format: "{sensorType}_{height}m [{unit}]"
      timestamp_column: "Date/time"
      timestamp_format: "yyyy-mm-dd HH:MM:SS"
      delim: "\t"
      skip_to: ["Date/time"]
    mappings:
     - match:
         sensorType: Speed
       rule:
         sensorType: WindSpeed
         unit: m/s
         statType: avg
     - match:
         sensorType: Direction
       rule:
         sensorType: WindDirection
         unit: deg
         statType: avg

Analysis:
  time_range:
    min: null
    max: null
  target_height: null
  ti_target_height: null