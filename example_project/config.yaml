Mast:
  name: "nrg-mast"
  # data_path field removed - now referenced by name from parse-sensors.toml
  rules:
    - name: "High Wind Speed Layer Difference"
      sensorType: "WindSpeed"
      height:
        min: 70.0
        max: null
      layer_difference:
        lower_layer_height: 20.0
        abs_diff:
          min: null
          max: 2.0
        lower_wind_speed:
          min: null
          max: null
    - name: "High Wind Speed Layer Difference; 50m"
      sensorType: "WindSpeed"
      height:
        min: null
        max: 50
      layer_difference:
        lower_layer_height: 20.0
        abs_diff:
          min: null
          max: 3.0
        lower_wind_speed:
          min: null
          max: null
    - name: "High Wind Speed Layer Difference"
      sensorType: "WindDirection"
      height:
        min: 70.0
        max: null
      layer_difference:
        lower_layer_height: 20.0
        abs_diff:
          min: null
          max: 22.5
        lower_wind_speed:
          min: 3
          max: 25
    - name: "Wind Speed Range"
      sensorType: "WindSpeed"
      height:
        min: null
        max: null
      out_of_range:
        min: 0.0
        max: 30.0
    - name: "Wind Direction Range"
      sensorType: "WindDirection"
      height:
        min: null
        max: null
      out_of_range:
        min: 0.0
        max: 360.0
    - name: "Icing WS Detection"
      sensorType: "WindSpeed"
      height:
        min: null
        max: null
      icing:
        time_range: 7200
        max_change: 0.02
    - name: "Icing WD Detection"
      sensorType: "WindDirection"
      height:
        min: null
        max: null
      icing:
        time_range: 7200
        max_change: 1
Meso:
  name: "era5"
  # data_path field removed - now referenced by name from parse-sensors.toml
Analysis:
  time_range:
    min: null
    max: null