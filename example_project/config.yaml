Mast:
  data_path: nrg-data.txt  # Path to data file (relative to config.yaml)
  delim: "\t"
  skip_to: 
    - "/^Data/"
    - "/^Timestamp/"
  sensor:
    column_format: "Ch{channel}_{sensorType}_{height}m_{sensorDirection}_{statType}_{unit}"
    timestamp_column: Timestamp
    timestamp_format: "yyyy-mm-dd HH:MM:SS"
    delim: "\t"
    mappings:
     - match:
         sensorType: Anem
       rule:
         sensorType: WindSpeed
         unit: m/s
     - match:
         sensorType: Vane
       rule:
         sensorType: WindDirection
         unit: deg
     - match:
         sensorType: Temp
       rule:
         sensorType: Temperature
         unit: C
     - match:
         sensorType: Press
       rule:
         sensorType: Pressure
         unit: hPa
     - match:
         statType: Avg
       rule:
         statType: avg
     - match:
         statType: Max
       rule:
         statType: max
     - match:
         statType: Min
       rule:
         statType: min
     - match:
         statType: SD
       rule:
         statType: sd
  rules:
    - name: "High Wind Speed Layer Difference"
      sensorType: "WindSpeed"
      height:
        min: 70.0
        max: null
      layer_difference:
        lower_layer_height: 20.0
        abs_diff:
          min: null
          max: 2.0
        lower_wind_speed:
          min: null
          max: null
    - name: "High Wind Speed Layer Difference; 50m"
      sensorType: "WindSpeed"
      height:
        min: null
        max: 50
      layer_difference:
        lower_layer_height: 20.0
        abs_diff:
          min: null
          max: 3.0
        lower_wind_speed:
          min: null
          max: null
    - name: "High Wind Speed Layer Difference"
      sensorType: "WindDirection"
      height:
        min: 70.0
        max: null
      layer_difference:
        lower_layer_height: 20.0
        abs_diff:
          min: null
          max: 22.5
        lower_wind_speed:
          min: 3
          max: 25
    - name: "Wind Speed Range"
      sensorType: "WindSpeed"
      height:
        min: null
        max: null
      out_of_range:
        min: 0.0
        max: 30.0
    - name: "Wind Direction Range"
      sensorType: "WindDirection"
      height:
        min: null
        max: null
      out_of_range:
        min: 0.0
        max: 360.0
    - name: "Icing WS Detection"
      sensorType: "WindSpeed"
      height:
        min: null
        max: null
      icing:
        time_range: 7200
        max_change: 0.02
