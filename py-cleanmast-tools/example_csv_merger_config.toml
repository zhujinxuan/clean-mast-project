# Example configuration for CSV merger
# Usage: uv run csv-merger example_csv_merger_config.toml

# Output file path (relative to this config file)
output = "merged_mast_data.csv"

# Field delimiter (default is comma)
delim = ","

[input]
# Directory containing CSV files to merge
dir = "projects/tgl-group3/pre-masts/230017"

# Option 1: Combined datetime column
# [input.datetime]
# format = "%Y/%m/%d %H:%M"
# col = "DateTime"

# Option 2: Separate date and time columns (used in mast data)
[input.date]
format = "%Y/%m/%d"
col = "Date"

[input.time]
format = "%H:%M"
col = "Time"

# Header detection options (choose ONE)

# Option 1: Use specific line number (0-based indexing)
# [input.headline]
# number = 2

# Option 2: Use regex pattern to find header line
[input.headline]
regex = "^Date,Time,Battery"