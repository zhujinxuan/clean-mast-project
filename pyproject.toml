[project]
name = "clean-mast-workspace"
version = "0.1.0"
description = "Wind energy meteorological tower data processing toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "CleanMast Team"}
]
dependencies = [
    "openpyxl>=3.1.5",
    "scikit-learn>=1.8.0",
]

[tool.uv.workspace]
members = [
    "packages/preprocess-tools",
    "packages/cleanmast",
    "packages/typst_ir"
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "ruff>=0.1.0",
    "mypy>=1.8",
    "pyright>=1.1",
    "import-linter>=2.11",
]

# Shared tool configurations
[tool.ruff]
line-length = 92
target-version = "py311"
preview = true  # Required for PLW1514 (unspecified-encoding)

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle, pyflakes, isort
extend-select = ["PLW1514"]  # unspecified-encoding - enforces encoding on open() and Path.read_text/write_text
ignore = ["E501"]  # Line too long - accept long lines to save tokens

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, tighten later

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"  # Can be "off", "basic", or "strict"
reportMissingImports = true
reportMissingTypeStubs = false
exclude = [
    "**/__pycache__",
    "**/.*",
    "**/node_modules",
    "**/.venv",
]

[tool.ty.src]
exclude = [
    "tests/",
    "*/tests/",
    "**/tests/",
    "experiments/",
    "*/experiments/",
    "**/experiments/",
]

[tool.pytest.ini_options]
testpaths = [
    "packages/cleanmast/tests",
    "packages/preprocess-tools/tests"
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["packages/*/src"]
omit = ["*/tests/*", "*/.venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
