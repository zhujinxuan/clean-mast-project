format:
  column_format: "Ch{channel}_{sensorType}_{height}m_{sensorDirection}_{statType}_{unit}"
  timestamp_column: Timestamp
  timestamp_format: "yyyy-mm-dd HH:MM:SS"
  delim: "\t"
  mappings:
    - match:
        sensorType: Anem
      rule:
        sensorType: WindSpeed
        unit: m/s
    - match:
        sensorType: Vane
      rule:
        sensorType: WindDirection
        unit: deg
    - match:
        statType: Avg
      rule:
        statType: avg
    - match:
        statType: Max
      rule:
        statType: max
    - match:
        statType: Min
      rule:
        statType: min
    - match:
        statType: SD
      rule:
        statType: sd
    - match:
        sensorType: Analog
        unit: C
      rule:
        sensorType: Temperature
    - match:
        sensorType: Analog
        unit: C
      rule:
        sensorType: Temperature
    - match:
        sensorType: Analog
        unit: hPa
      rule:
        sensorType: Pressure
        unit: Pa
        multiplier: 100.0