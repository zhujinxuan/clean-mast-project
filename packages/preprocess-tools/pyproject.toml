[project]
name = "preprocess-tools"
version = "0.1.0"
description = "Generic CSV preprocessing utilities for wind measurement data"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "CleanMast Team"}
]

dependencies = [
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "polars>=0.20.0",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
    "colorama>=0.4.0",
    "chardet>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
# Unified CLI with subcommands
preprocess = "preprocess_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["src/preprocess_tools"]
