[project]
name = "typst-ir"
version = "0.1.0"
description = "Typst Intermediate Representation for document processing"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "CleanMast Team"}
]

dependencies = [
    "pydantic>=2.0",
    "tree-sitter>=0.20.0,<0.26.0",
    "tree-sitter-typst @ git+https://github.com/uben0/tree-sitter-typst",
    "typer>=0.9.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
typst-ir = "typst_ir.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["src/typst_ir"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
