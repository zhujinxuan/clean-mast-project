[[rules]]
name = "High Wind Speed Layer Difference"
sensorType = "WindSpeed"
height.min = 70.0
[rules.layer_difference]
lower_layer_height = 20.0
abs_diff.max = 2.0
[rules.layer_difference.lower_wind_speed]

[[rules]]
name = "High Wind Speed Layer Difference; 50m"
sensorType = "WindSpeed"
height.max = 50
[rules.layer_difference]
lower_layer_height = 20.0
abs_diff.max = 3.0
[rules.layer_difference.lower_wind_speed]

[[rules]]
name = "High Wind Speed Layer Difference"
sensorType = "WindDirection"
height.min = 70.0
[rules.layer_difference]
lower_layer_height = 20.0
abs_diff.max = 22.5
[rules.layer_difference.lower_wind_speed]
min = 3
max = 25

[[rules]]
name = "Wind Speed Range"
sensorType = "WindSpeed"
[rules.out_of_range]
min = 0.0
max = 30.0

[[rules]]
name = "Wind Direction Range"
sensorType = "WindDirection"
[rules.out_of_range]
min = 0.0
max = 360.0

[[rules]]
name = "Icing WS Detection"
sensorType = "WindSpeed"
[rules.icing]
time_range = 18000
max_change = 0.02

[[rules]]
name = "Icing WD Detection"
sensorType = "WindDirection"
[rules.icing]
time_range = 18000
max_change = 1