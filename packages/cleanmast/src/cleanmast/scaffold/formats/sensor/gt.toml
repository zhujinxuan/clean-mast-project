# Example sensor format demonstrating regex patterns for sensor direction
timestamp_column = "Date/Time"

# Example with A/B sensor directions using regex patterns
[[columns]]
match = "{sensorType}_{height}{sensorDirection}m_{statType} \\[{unit}\\]"
format = "{sensorType}_{height}{sensorDirection}m_{statType} [{unit}]"
[columns.patterns]
sensorDirection = "[AB]"  # Matches A or B direction indicators

[[columns]]
match = "{sensorType}_{height}{sensorDirection}m_{statType} {unit}"
format = "{sensorType}_{height}{sensorDirection}m_{statType} [{unit}]"
[columns.patterns]
sensorDirection = "[AB]"  # Matches A or B direction indicators

# Example without direction
[[columns]]
match = "{sensorType}_{height}m_{statType} \\[{unit}\\]"
format = "{sensorType}_{height}m_{statType} [{unit}]"

[[columns]]
match = "{sensorType}_{height}m_{statType} {unit}"
format = "{sensorType}_{height}m_{statType} [{unit}]"


# Mapping rules
[[mappings]]
[mappings.match]
sensorType = "WS"
[mappings.rule]
sensorType = "WindSpeed"
unit = "m/s"

[[mappings]]
[mappings.match]
sensorType = "WD"
[mappings.rule]
sensorType = "WindDirection"
unit = "deg"

[[mappings]]
[mappings.match]
statType = "Avg"
[mappings.rule]
statType = "avg"

[[mappings]]
[mappings.match]
statType = "Max"
[mappings.rule]
statType = "max"

[[mappings]]
[mappings.match]
statType = "Min"
[mappings.rule]
statType = "min"

[[mappings]]
[mappings.match]
statType = "Std"
[mappings.rule]
statType = "sd"

[[mappings]]
[mappings.match]
sensorType = "AirTC"
[mappings.rule]
sensorType = "Temperature"
unit = "C"

[[mappings]]
[mappings.match]
sensorType = "BP"
[mappings.rule]
sensorType = "Pressure"
unit = "Pa"
multiplier = 100.0 