[project]
name = "cleanmast"
version = "0.1.0"
description = "Wind energy meteorological tower data analysis toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "CleanMast Team"}
]

dependencies = [
    "preprocess-tools", # Internal workspace dependency
    "polars>=0.20",
    "pyarrow>=15.0",
    "pandas>=2.0",
    "click>=8.0",
    "pydantic>=2.0",
    "numpy>=2.3.5",
    "tomli>=2.0",
    "tomli-w>=1.2.0",
    "pyyaml>=6.0.3",
    "dataframely>=0.2.0",
    "typing-extensions>=4.15.0",
    "altair>=5.0",
    "vl-convert-python>=1.0",
]

[tool.uv.sources]
preprocess-tools = { workspace = true }

[project.optional-dependencies]
analysis = [
    "scipy>=1.11",
    "statsmodels>=0.14",
]
visualization = [
    "matplotlib>=3.8",
    "seaborn>=0.12",
]
reports = [
    "jinja2>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
# All optional dependencies for development
all = [
    "cleanmast[analysis,visualization,reports,dev]",
]

[project.scripts]
cleanmast = "cleanmast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "import-linter>=2.11",
]

[tool.hatchling.build.targets.wheel]
packages = ["src/cleanmast"]


[tool.importlinter]
root_packages = ["cleanmast"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "DDD Bounded Context Isolation"
type = "forbidden"
source_modules = [
    "cleanmast.subdomains.dataingestion",
    "cleanmast.subdomains.dataprocessing",
    "cleanmast.subdomains.analysis",
    "cleanmast.subdomains.reporting",
    "cleanmast.subdomains.configuration",
    "cleanmast.subdomains.pipeline",
]
forbidden_modules = [
    "cleanmast.subdomains.dataingestion",
    "cleanmast.subdomains.dataprocessing",
    "cleanmast.subdomains.analysis",
    "cleanmast.subdomains.reporting",
    "cleanmast.subdomains.configuration",
    "cleanmast.subdomains.pipeline",
]
ignore_imports = [
    "cleanmast.subdomains.dataingestion -> cleanmast.subdomains.dataingestion",
    "cleanmast.subdomains.dataprocessing -> cleanmast.subdomains.dataprocessing",
    "cleanmast.subdomains.analysis -> cleanmast.subdomains.analysis",
    "cleanmast.subdomains.reporting -> cleanmast.subdomains.reporting",
    "cleanmast.subdomains.configuration -> cleanmast.subdomains.configuration",
    "cleanmast.subdomains.pipeline -> cleanmast.subdomains.pipeline",
]

[[tool.importlinter.contracts]]
name = "Domain Layer Purity"
type = "forbidden"
source_modules = [
    "cleanmast.subdomains.dataingestion.value_objects",
    "cleanmast.subdomains.dataingestion.entities",
    "cleanmast.subdomains.dataingestion.domain_services",
    "cleanmast.subdomains.dataprocessing.value_objects",
    "cleanmast.subdomains.dataprocessing.entities",
    "cleanmast.subdomains.dataprocessing.domain_services",
    "cleanmast.subdomains.analysis.value_objects",
    "cleanmast.subdomains.reporting.value_objects",
    "cleanmast.subdomains.reporting.entities",
]
forbidden_modules = [
    "polars",
    "pandas",
    "sqlalchemy",
    "click",
    "cleanmast.db",
    "cleanmast.infrastructure",
]

[[tool.importlinter.contracts]]
name = "Application Layer Dependencies"
type = "layers"
containers = ["cleanmast"]
layers = [
    "application",
    "subdomains",
]

[[tool.importlinter.contracts]]
name = "Repository Protocol Access"
type = "allowed"
source_modules = [
    "cleanmast.subdomains.dataprocessing",
    "cleanmast.subdomains.analysis",
    "cleanmast.subdomains.reporting",
]
allowed_modules = [
    "cleanmast.subdomains.dataingestion.repositories",
    "cleanmast.subdomains.dataingestion.value_objects",
]

[[tool.importlinter.contracts]]
name = "CLI Isolation"
type = "forbidden"
source_modules = ["cleanmast.cli"]
forbidden_modules = [
    "cleanmast.subdomains.dataingestion",
    "cleanmast.subdomains.dataprocessing",
    "cleanmast.subdomains.analysis",
    "cleanmast.subdomains.reporting",
    "cleanmast.db.repositories",
]
allowed_modules = [
    "cleanmast.application",
]

[[tool.importlinter.contracts]]
name = "No Circular Imports"
type = "no_circular_imports"
modules = ["cleanmast"]



[tool.pytest.ini_options]
