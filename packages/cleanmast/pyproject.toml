[project]
name = "cleanmast"
version = "0.1.0"
description = "Wind energy meteorological tower data analysis toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "CleanMast Team"}
]

dependencies = [
    "preprocess-tools", # Internal workspace dependency
    "polars>=0.20",
    "pyarrow>=15.0",
    "pandas>=2.0",
    "click>=8.0",
    "pydantic>=2.0",
    "numpy>=2.3.5",
    "tomli>=2.0",
    "tomli-w>=1.2.0",
    "pyyaml>=6.0.3",
    "dataframely>=0.2.0",
    "typing-extensions>=4.15.0",
    "altair>=5.0",
    "vl-convert-python>=1.0",
    "typst-ir>=0.1.0",
    "Pillow>=10.0",
    "scipy>=1.10",
    "matplotlib>=3.8",
]

[tool.uv.sources]
preprocess-tools = { workspace = true }
typst-ir = { workspace = true }

[project.optional-dependencies]
analysis = [
    "scipy>=1.11",
    "statsmodels>=0.14",
]
visualization = [
    "seaborn>=0.12",
]
reports = [
    "jinja2>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
# All optional dependencies for development
all = [
    "cleanmast[analysis,visualization,reports,dev]",
]

[project.scripts]
cleanmast = "cleanmast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ast-grep-py>=0.34",
    "import-linter>=2.11",
]

[tool.hatchling.build.targets.wheel]
packages = ["src/cleanmast"]

[tool.pytest.ini_options]
