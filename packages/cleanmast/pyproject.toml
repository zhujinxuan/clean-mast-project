[project]
name = "cleanmast"
version = "0.1.0"
description = "Wind energy meteorological tower data analysis toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "CleanMast Team"}
]

dependencies = [
    "preprocess-tools",  # Internal workspace dependency
    "polars>=0.20",
    "pandas>=2.0",
    "click>=8.0",
    "pydantic>=2.0",
]

[tool.uv.sources]
preprocess-tools = { workspace = true }

[project.optional-dependencies]
analysis = [
    "scipy>=1.11",
    "statsmodels>=0.14",
]
visualization = [
    "matplotlib>=3.8",
    "seaborn>=0.12",
]
reports = [
    "jinja2>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
# All optional dependencies for development
all = [
    "cleanmast[analysis,visualization,reports,dev]",
]

[project.scripts]
cleanmast = "cleanmast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["src/cleanmast"]
